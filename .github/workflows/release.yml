name: "Release App"

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install

      - name: set dynamic beta version in CI
        run: |
          node -e '
            const fs = require("fs");
            const ver = "0.1.0-beta.${{ github.run_number }}";
            const pkg = JSON.parse(fs.readFileSync("package.json"));
            pkg.version = ver;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));

            const tauriConf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json"));
            tauriConf.version = ver;
            fs.writeFileSync("src-tauri/tauri.conf.json", JSON.stringify(tauriConf, null, 2));
            console.log("Updated CI build version to:", ver);
          '

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v0.1.0-beta.${{ github.run_number }}
          releaseName: "Beta Release v0.1.0-beta.${{ github.run_number }}"
          releaseBody: "Automated Beta build for testing."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
